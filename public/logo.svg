<svg width="140" height="160" viewBox="0 0 140 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Royal Citadel College crest">
  <defs>
    <linearGradient id="royalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4C430"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE25A"/>
      <stop offset="100%" stop-color="#E0A912"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
    <path id="mottoArc" d="M 28,128 Q 70,142 112,128" fill="none"/>
  </defs>

  <!-- "R.C.C" monogram disc at top -->
  <circle cx="70" cy="16" r="13" fill="url(#royalGrad)" stroke="#F4C430" stroke-width="1.4"/>
  <text x="70" y="20" font-family="Oswald, Arial, sans-serif" font-size="9" font-weight="700" fill="#F4C430" text-anchor="middle" letter-spacing="0.5">R.C.C</text>

  <!-- Crown above shield (royal theme) -->
  <g transform="translate(70,33)">
    <path d="M -14,4 L -14,-3 L -9,2 L -4.5,-6 L 0,2 L 4.5,-6 L 9,2 L 14,-3 L 14,4 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.5"/>
    <rect x="-14" y="4" width="28" height="3" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.4"/>
    <circle cx="-9" cy="-3" r="1.6" fill="#4A3B69"/>
    <circle cx="0" cy="-7" r="1.8" fill="#4A3B69"/>
    <circle cx="9" cy="-3" r="1.6" fill="#4A3B69"/>
  </g>

  <!-- Shield outline (royal blue border) -->
  <path d="M 16,40 L 124,40 L 124,84 Q 124,118 70,138 Q 16,118 16,84 Z" fill="url(#royalGrad)"/>

  <!-- Shield inner (gold) -->
  <path d="M 20,44 L 120,44 L 120,83 Q 120,114 70,132 Q 20,114 20,83 Z" fill="url(#goldFill)" stroke="#B8860B" stroke-width="0.8"/>

  <!-- Inner decorative border -->
  <path d="M 24,48 L 116,48 L 116,82 Q 116,110 70,126 Q 24,110 24,82 Z" fill="none" stroke="#1B3A6B" stroke-width="0.7" opacity="0.4"/>

  <!-- Central emblem: torch (enlightenment) above an open book (knowledge) -->
  <g transform="translate(70,86)">
    <!-- Torch flame -->
    <path d="M 0,-30 Q -4,-24 -2,-18 Q 0,-20 2,-18 Q 4,-24 0,-30 Z" fill="#E53935"/>
    <path d="M 0,-27 Q -2,-23 -1,-20 Q 0,-21 1,-20 Q 2,-23 0,-27 Z" fill="#F4C430"/>
    <!-- Torch handle -->
    <rect x="-2" y="-18" width="4" height="10" fill="#1B3A6B"/>
    <rect x="-4" y="-9" width="8" height="2.5" fill="#1B3A6B" rx="1"/>

    <!-- Open book below torch -->
    <g transform="translate(0,4)">
      <path d="M -20,0 Q -10,-4 0,0 L 0,12 Q -10,8 -20,12 Z" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="0.5"/>
      <path d="M 0,0 Q 10,-4 20,0 L 20,12 Q 10,8 0,12 Z" fill="#FAFAFA" stroke="#1B3A6B" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#1B3A6B" stroke-width="0.7"/>
      <path d="M -16,3 Q -8,1 0,3 M -16,7 Q -8,5 0,7" stroke="#9A8B1F" stroke-width="0.4" fill="none" opacity="0.6"/>
      <path d="M 0,3 Q 8,1 16,3 M 0,7 Q 8,5 16,7" stroke="#9A8B1F" stroke-width="0.4" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- Laurel flourishes on either side of the book -->
  <g transform="translate(38,92)" opacity="0.8">
    <path d="M 0,-4 Q -6,0 -4,8 Q 0,4 4,0 Q 0,-2 0,-4 Z" fill="url(#royalGrad)"/>
  </g>
  <g transform="translate(102,92)" opacity="0.8">
    <path d="M 0,-4 Q 6,0 4,8 Q 0,4 -4,0 Q 0,-2 0,-4 Z" fill="url(#royalGrad)"/>
  </g>

  <!-- Motto ribbon banner -->
  <g>
    <!-- Left ribbon tail -->
    <path d="M 6,128 L 22,124 L 22,140 L 6,144 L 14,136 Z" fill="url(#ribbonGrad)"/>
    <!-- Right ribbon tail -->
    <path d="M 134,128 L 118,124 L 118,140 L 134,144 L 126,136 Z" fill="url(#ribbonGrad)"/>
    <!-- Main ribbon -->
    <path d="M 18,122 Q 70,134 122,122 L 122,138 Q 70,150 18,138 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.5"/>
    <!-- Motto text -->
    <text font-family="Oswald, Arial, sans-serif" font-size="6.6" font-weight="700" fill="#1B3A6B" letter-spacing="0.5">
      <textPath href="#mottoArc" startOffset="50%" text-anchor="middle">DISCIPLINE · KNOWLEDGE · EXCELLENCE</textPath>
    </text>
  </g>
</svg>
